#Minecraft server properties
#Configuracao otimizada para PaperMC com GeyserMC + Floodgate + Playit.gg

# Modo OFFLINE - necessario para Floodgate/Geyser funcionar
# AuthMe cuida da autenticacao dos jogadores Java
online-mode=false

# Porta principal do servidor Java (TCP)
server-port=25565

# Configuracoes basicas
server-name=Servidor Minecraft
level-name=world
level-seed=91276453817984294
level-type=minecraft\:normal
gamemode=survival
difficulty=normal
max-players=20

# Performance - otimizado para notebook antigo
view-distance=6
simulation-distance=4
sync-chunk-writes=true
rate-limit=0

# Network compression (reduz uso de CPU em redes locais/tunel)
network-compression-threshold=256

# Protecao e seguranca
enable-command-block=true
spawn-protection=0
# enforce-secure-profile=false permite jogadores sem conta Microsoft (Floodgate)
enforce-secure-profile=false
enforce-whitelist=false

# Performance adicional
max-chained-neighbor-updates=1000000
entity-broadcast-range-percentage=75

# Whitelist e RCON
white-list=false
enable-rcon=false
enable-query=false

# Misc
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
allow-nether=true
force-gamemode=false
hardcore=false
pvp=true
allow-flight=true
max-world-size=29999984
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
